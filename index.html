<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            /* 蓝色渐变背景 */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #4b79c4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
        }

        /* ========== 内容容器 ========== */
        .container {
            max-width: 700px;
            padding: 40px 30px;
        }

        /* 大标题欢迎语 */
        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1.2s ease;
        }

        /* 分隔线 */
        .divider {
            width: 80px;
            height: 3px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            margin: 0 auto 24px;
            animation: growLine 1.2s ease;
        }

        /* 小字介绍 */
        p.intro {
            font-size: 1.05rem;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 36px;
            animation: fadeIn 1.4s ease;
        }

        /* 联系方式 */
        .contact {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .contact a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 26px;
            font-size: 1.05rem;
            color: #1e3c72;
            background: #ffffff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeIn 1.6s ease;
        }

        .contact a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        /* 底部日期与时间 */
        .datetime {
            margin-top: 32px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            animation: fadeIn 1.8s ease;
        }

        /* ========== 动画 ========== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes growLine {
            from { width: 0; opacity: 0; }
            to   { width: 80px; opacity: 1; }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            p.intro { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 大标题欢迎语 -->
        <h1 id="greeting">欢迎来到我的个人博客</h1>

        <!-- 分隔线 -->
        <div class="divider"></div>

        <!-- 小字介绍 -->
        <p class="intro">
            你好！我是 endcreeper861，一名热爱编程与分享的开发者。<br>
            这里记录我的学习笔记、项目心得与生活点滴，欢迎常来看看！
        </p>

        <!-- 联系方式 -->
        <div class="contact">
            如有任何问题或建议，欢迎通过邮箱联系我：
            <br>
            <a href="mailto:3130450154@qq.com">📧 3130450154@qq.com</a>
        </div>

        <!-- 当前时间 -->
        <div class="datetime" id="datetime"></div>
    </div>

    <script>
        // ========== 根据时间段显示不同问候语 ==========
        function updateGreeting() {
            var hour = new Date().getHours();
            var greeting = "欢迎来到我的个人博客";
            if (hour >= 5 && hour < 9) {
                greeting = "早上好！欢迎来到我的个人博客";
            } else if (hour >= 9 && hour < 12) {
                greeting = "上午好！欢迎来到我的个人博客";
            } else if (hour >= 12 && hour < 18) {
                greeting = "下午好！欢迎来到我的个人博客";
            } else if (hour >= 18 || hour < 5) {
                greeting = "晚上好！欢迎来到我的个人博客";
            }
            document.getElementById("greeting").textContent = greeting;
        }

        // ========== 实时显示日期时间 ==========
        function updateDateTime() {
            var now = new Date();
            var days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            var pad = function (n) { return n < 10 ? "0" + n : n; };
            var str =
                now.getFullYear() + " 年 " + (now.getMonth() + 1) + " 月 " +
                now.getDate() + " 日 " + days[now.getDay()] + " " +
                pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
            document.getElementById("datetime").textContent = "今天是 " + str;
        }

        // 页面加载时执行，并每秒刷新一次时间
        updateGreeting();
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
